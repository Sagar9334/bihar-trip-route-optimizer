<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Explore Bihar | Smart Trip Planner</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #f8fafc 0%, #edf2f7 50%, #e2e8f0 100%);
            color: #0f172a;
            padding: 24px;
        }
        .hero-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 24px;
            padding: 60px 45px;
            max-width: 650px;
            text-align: center;
            box-shadow: 0 20px 45px -10px rgba(15, 23, 42, 0.08), 0 10px 20px -5px rgba(15, 23, 42, 0.04);
        }
        .badge-pill {
            display: inline-block;
            background: #eff6ff;
            color: #2563eb;
            border: 1px solid #dbeafe;
            padding: 6px 16px;
            border-radius: 50px;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 42px;
            font-weight: 800;
            color: #0f172a;
            letter-spacing: -1px;
            line-height: 1.2;
            margin-bottom: 12px;
        }
        h3 {
            font-size: 18px;
            font-weight: 600;
            color: #2563eb;
            margin-bottom: 20px;
        }
        p {
            font-size: 15px;
            color: #64748b;
            line-height: 1.7;
            margin-bottom: 40px;
            font-weight: 400;
        }
        .btn-start {
            display: inline-block;
            padding: 16px 42px;
            font-size: 16px;
            font-weight: 700;
            color: #ffffff;
            background: linear-gradient(135deg, #2563eb 0%, #1d4ed8 100%);
            border: none;
            border-radius: 12px;
            text-decoration: none;
            transition: all 0.25s ease;
            box-shadow: 0 10px 20px -5px rgba(37, 99, 235, 0.35);
        }
        .btn-start:hover {
            transform: translateY(-2px);
            box-shadow: 0 14px 25px -5px rgba(37, 99, 235, 0.45);
            background: linear-gradient(135deg, #1d4ed8 0%, #1e40af 100%);
        }
    </style>
</head>
<body>
    <div class="hero-card">
        <span class="badge-pill">⚡ DSA Route Optimization Engine</span>
        <h1>Explore Bihar</h1>
        <h3>Intelligent Travel & Multi-Circuit Planner</h3>
        <p>Plan your journey from any district across India. Our graph algorithm calculates the shortest transit vectors, dynamic state base fares, and curated stay packages.</p>
        <a href="/details" class="btn-start">Launch Trip Planner ➔</a>
    </div>
</body>
</html>
